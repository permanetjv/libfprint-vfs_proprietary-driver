[Unit]
Requires=vfs495-vendor.service
BindsTo=vfs495-vendor.service
After=vfs495-vendor.service
JoinsNamespaceOf=vfs495-vendor.service

[Service]
PrivateIPC=true
Environment=VFS_PROPRIETARY_WRAPPER_PATH=/var/lib/vfs495-runtime/vendor/usr/lib64/libvfsFprintWrapper.so
Environment=VFS_PROPRIETARY_TOMMATH_PATH=/usr/lib64/libtommath.so.1
Environment=VFS_PROPRIETARY_RUNTIME_LIBRARY_PATH=/var/lib/vfs495-runtime/vendor/usr/lib64:/var/lib/vfs495-runtime/openssl/usr/lib64:/var/lib/vfs495-runtime/libusb/usr/lib64
